name: pathguard_vpn
description: PathGuard VPN – Free Proxy
publish_to: 'none'
version: 1.0.5+1005

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.2.0
  in_app_update: ^5.0.0
  shared_preferences: ^2.3.2
  intl: any # version pinned by flutter_localizations
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  permission_handler: ^11.3.1
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1
  collection: ^1.18.0
  path_provider: ^2.1.6
  share_plus: ^10.0.0
  in_app_review: ^2.0.10
  file_picker: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vpngate_snapshot.csv
    - assets/l10n/
    - assets/brand/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#0B0F1A"
  android: true
  android_12:
    color: "#0B0F1A"
