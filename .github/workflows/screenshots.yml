name: Store screenshots

on:
  workflow_dispatch:
  push:
    paths: [ "screenshots/**", ".github/workflows/screenshots.yml" ]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fonts (Arabic + emoji flags)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji && fc-list | grep -iE "emoji|NotoSansArabic-Regular|Symbols2|NotoSans-Regular|NotoSansMath" | head
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Render screenshots
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          flutter pub get
          flutter test screenshots/screenshot_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: build/screenshots/*.png

      - name: Publish screenshots as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-screenshots-${{ github.run_number }}
          name: Store screenshots ${{ github.run_number }}
          prerelease: true
          files: build/screenshots/*.png
