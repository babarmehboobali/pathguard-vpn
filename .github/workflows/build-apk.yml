name: Build PathGuard Play bundle

on:
  push:
    branches: [ "release/pathguard-1.0.5-bundle" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fetch OpenVPN engine
        run: bash tool/fetch_ovpn.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Unit tests
        run: flutter test

      - name: Build and stage the bundle for local signing
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab PathGuardVPN-1.0.5-1005-unsigned.aab
          zip -d PathGuardVPN-1.0.5-1005-unsigned.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC'
          unzip -tq PathGuardVPN-1.0.5-1005-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: PathGuardVPN-1.0.5-1005-unsigned
          path: PathGuardVPN-1.0.5-1005-unsigned.aab
          if-no-files-found: error
